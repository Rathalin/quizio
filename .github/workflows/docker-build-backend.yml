name: Go Backend - Build and Push Docker Image

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "infra/**"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - "infra/**"
  workflow_dispatch:

jobs:
  build-go-backend:
    name: Build & Push Go Backend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Verify and Test Backend
        run: |
          cd backend
          go vet ./...
          go test ./...

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/rathalin/quizio/go-backend:latest \
            -t ghcr.io/rathalin/quizio/go-backend:${{ github.sha }} \
            ./backend

      - name: Push Docker Image
        if: github.event_name != 'pull_request'
        run: |
          docker push ghcr.io/rathalin/quizio/go-backend:latest
          docker push ghcr.io/rathalin/quizio/go-backend:${{ github.sha }}
