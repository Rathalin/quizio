version: '3'
services:
  quizio-strapi:
    image: ghcr.io/rathalin/quizio:latest
    restart: always
    networks:
      - nginx-net
    volumes:
      - strapidb:/opt/app/.tmp
      - strapiuploads:/opt/app/public/uploads
    env_file:
      - .env
volumes:
  strapidb:
  strapiuploads:
networks:
  nginx-net:
    external: true
