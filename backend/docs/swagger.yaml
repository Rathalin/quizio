basePath: /
definitions:
  models.Answer:
    properties:
      id:
        type: integer
      isCorrect:
        type: boolean
      question:
        $ref: '#/definitions/models.Question'
      questionID:
        type: integer
      title:
        type: string
      uuid:
        type: string
    type: object
  models.Question:
    properties:
      answers:
        items:
          $ref: '#/definitions/models.Answer'
        type: array
      description:
        type: string
      explanation:
        type: string
      id:
        type: integer
      quiz:
        $ref: '#/definitions/models.Quiz'
      quizID:
        type: integer
      title:
        type: string
      uuid:
        type: string
    type: object
  models.Quiz:
    properties:
      description:
        type: string
      id:
        type: integer
      isPublished:
        type: boolean
      playCount:
        type: integer
      questions:
        items:
          $ref: '#/definitions/models.Question'
        type: array
      title:
        type: string
      uuid:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is a sample server for Quizio.
  title: Quizio API
  version: "1.0"
paths:
  /quizzes:
    get:
      description: Get all quizzes from the database
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Quiz'
            type: array
      summary: Get all quizzes
      tags:
      - quizzes
swagger: "2.0"
