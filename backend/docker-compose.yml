services:
  go-backend:
    build:
      context: .
    pull_policy: build
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      - postgres-db
    environment:
      - GO_ENV=${GO_ENV}
      - JWT_SECRET=${JWT_SECRET}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - nginx-net

  postgres-db:
    image: postgres
    restart: always
    volumes:
      - ./sql-scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - nginx-net

  adminer:
    build:
      context: ../adminer
      dockerfile: Dockerfile.adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    networks:
      - nginx-net

volumes:
  db:
  uploads:
networks:
  nginx-net:
    external: true
