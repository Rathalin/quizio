services:
  go-backend:
    build:
      context: ../backend
    pull_policy: build
    restart: always
    ports:
      - "8081:8080"
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      - postgres-db
    environment:
      - GO_ENV=${GO_ENV}
      - JWT_SECRET=${JWT_SECRET}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - OPENAPI_DOCS_USER=${OPENAPI_DOCS_USER}
      - OPENAPI_DOCS_PASSWORD=${OPENAPI_DOCS_PASSWORD}

  postgres-db:
    image: postgres
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - ../backend/sql-scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  adminer:
    build:
      context: ../adminer
    pull_policy: build
    restart: always
    ports:
      - "8082:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=${POSTGRES_HOST}
    depends_on:
      - postgres-db

volumes:
  db:
  uploads:
