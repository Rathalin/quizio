services:
  go-backend:
    image: ghcr.io/rathalin/quizio/go-backend:latest
    restart: always
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      - postgres-db
    environment:
      - GO_ENV=${GO_ENV}
      - JWT_SECRET=${JWT_SECRET}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - OPENAPI_DOCS_USER=${OPENAPI_DOCS_USER}
      - OPENAPI_DOCS_PASSWORD=${OPENAPI_DOCS_PASSWORD}
    networks:
      - nginx-net
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1"

  postgres-db:
    image: postgres
    restart: always
    volumes:
      - db:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - nginx-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"

  adminer:
    image: ghcr.io/rathalin/quizio/adminer:latest
    restart: always
    environment:
      - ADMINER_DEFAULT_SERVER=${POSTGRES_HOST}
    depends_on:
      - postgres-db
    networks:
      - nginx-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

volumes:
  db:
  uploads:
networks:
  nginx-net:
    external: true
